<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>김경순님의 58번째 생일파티 초대장</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;500;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#12030a; --ink:#f4e7d6; --soft:#cdb3b0; --gold:#d8b25f; --gold2:#f6dd9a;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Serif KR','Nanum Myeongjo','Apple SD Gothic Neo',serif;line-height:1.9;word-break:keep-all;-webkit-text-size-adjust:100%}
.wrap{padding:12px}
.card{max-width:520px;margin:0 auto;border:1px solid var(--gold);overflow:hidden;background:#1b050c}
.card>img{display:block;width:100%;height:auto}
.info{position:relative;padding:26px 24px 34px;text-align:center;
  background:
   radial-gradient(circle at 92% 8%,rgba(255,200,110,.45),rgba(255,200,110,0) 34px),
   radial-gradient(circle at 8% 30%,rgba(255,190,100,.3),rgba(255,190,100,0) 30px),
   radial-gradient(circle at 94% 62%,rgba(255,200,120,.32),rgba(255,200,120,0) 28px),
   radial-gradient(circle at 12% 92%,rgba(255,200,120,.35),rgba(255,200,120,0) 36px),
   linear-gradient(180deg,#2a0912,#150409)}
.orn{display:block;width:200px;height:20px;margin:0 auto 14px;fill:none;stroke:var(--gold);stroke-width:1.2;stroke-linecap:round}
.orn .f{fill:var(--gold)}
h1{margin:0 0 14px;font-weight:700;font-size:1.85rem;line-height:1.4;background:linear-gradient(180deg,var(--gold2),var(--gold) 55%,#a87a26);-webkit-background-clip:text;background-clip:text;color:transparent}
h1 small{display:block;font-size:1rem;font-weight:500;letter-spacing:.12em}
.dday{display:inline-block;padding:3px 20px;border:1px solid var(--gold);border-radius:999px;color:var(--gold2);font-size:.9rem;font-weight:500}
dl{margin:18px 0 0}
.row{padding:15px 0;border-top:1px solid rgba(216,178,95,.35)}
dt{color:var(--gold);font-weight:500;font-size:.85rem}
dd{margin:2px 0 0;font-size:1.08rem;font-weight:500;color:var(--gold2)}
dd span{display:block;color:var(--soft);font-weight:300;font-size:.9rem;margin-top:2px}
.actions{display:flex;gap:10px;margin-top:12px}
.btn{flex:1;padding:11px 8px;border:1px solid var(--gold);border-radius:8px;background:transparent;color:var(--gold2);font:inherit;font-size:.9rem;font-weight:500;text-align:center;text-decoration:none;cursor:pointer}
.btn.main{background:var(--gold);color:#2a0912}
.btn:focus-visible{outline:3px solid var(--gold2);outline-offset:2px}
.foot{margin:20px 0 0;color:var(--soft);font-weight:300;font-size:.88rem}
</style>
</head>
